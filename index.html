      if (c.type === "norikae") {
        if (isNewContract) return false;

        if (currentProvider === planKey) return false;
        return true;
      }

     SoftBankグループ 同時加入ボーナス計算ロジック
     ① 新規/他社乗り換え + SoftBank光/Air
        SB MNP  → 15,000pt（MNP）＋ 15,000pt（同時加入）= 30,000pt 即時
        YM MNP  → 16,500pt（MNP）＋ 15,000pt（同時加入）= 31,500pt 即時
     ② 既存SoftBank光/Air + SB/YM MNP
        SB MNP  → 15,000pt（MNP）即時 ＋ 後日15,000 PayPayPt
        YM MNP  → 16,500pt（MNP）即時 ＋ 後日15,000 PayPayPt
     他社光（ドコモ光・au等）+ SB/YM MNP
        → MNP pt のみ（SB:15,000 / YM:16,500）
        ※ au系はスマートバリュー必須なのでSBスマホとは組合せ不可のため表示なし
  ───────────────────────────────────────────────────── */
  const getSBBonus = (planKey) => {
    const sbCarriers = Object.entries(mobileCarriers).filter(([id,n])=>n>0&&MOBILE_CARRIERS.find(c=>c.id===id&&c.type==="softbank"));
    if(sbCarriers.length===0) return null;
    const plan = PLANS[planKey];
    let totalMnp=0,totalSim=0,totalExist=0,firstC=null;
    for(const [id,n] of sbCarriers){
      const carrier=MOBILE_CARRIERS.find(c=>c.id===id);
      if(!firstC)firstC=carrier;
      const mnpPt=carrier.mnpPt;
      if(plan.sbBonus){
        if(isExistingSB){totalMnp+=mnpPt*n;totalExist+=plan.sbBonus.existingPt*n;}
        else{totalMnp+=mnpPt*n;totalSim+=plan.sbBonus.newPt*n;}
      } else {
        // 全プランでMNP ptを表示（au系プランでもSB/YM MNPは表示）
        if(mnpPt>0)totalMnp+=mnpPt*n;
      }
    }
    if(!firstC||(totalMnp===0&&totalSim===0&&totalExist===0))return null;
    if(plan.sbBonus){
      if(isExistingSB)return{type:"existing",mnpPt:totalMnp,simultaneousPt:0,totalImmediate:totalMnp,existingPayPay:totalExist,carrier:firstC};
      return{type:"new",mnpPt:totalMnp,simultaneousPt:totalSim,totalImmediate:totalMnp+totalSim,existingPayPay:0,carrier:firstC};

    return{type:"mnponly",mnpPt:totalMnp,simultaneousPt:0,totalImmediate:totalMnp,existingPayPay:0,carrier:firstC};
  };

    if(total===0||!firstC) return null;

  const TV_KOJI = [

  const plansFixed = useMemo(() => {

      const idx  = getPlanIdx(key);

                                {"📱 SB/YM MNP"}
                                {sbBonus.type==="new"&&<span style={{marginLeft:6,fontSize:9,background:"#dcfce7",color:"#16a34a",borderRadius:4,padding:"1px 5px"}}>新規/乗り換え</span>}
                                {sbBonus.type==="existing"&&<span style={{marginLeft:6,fontSize:9,background:"#e0f2fe",color:"#0369a1",borderRadius:4,padding:"1px 5px"}}>MNP即時</span>}
                                {sbBonus.type==="new"&&<div style={{fontSize:9,color:"#64748b",marginTop:2}}>MNP {sbBonus.mnpPt.toLocaleString()}pt ＋ 同時加入 {sbBonus.simultaneousPt.toLocaleString()}pt</div>}
                              </div>
                              <div style={{textAlign:"right"}}>
                                <span style={{fontSize:26,fontWeight:900,color:"#0369a1"}}>{sbBonus.totalImmediate.toLocaleString()}</span>
                                <span style={{fontSize:11,color:"#0369a1",marginLeft:2}}>pt</span>
                              </div>
                            </div>
                          )}
                          {/* 後日PayPay（既存SBユーザー） */}
                          {sbBonus&&sbBonus.existingPayPay>0&&(
                            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 14px",background:"#fff",borderRadius:10,border:"2px dashed #f59e0b"}}>
                              <div style={{fontSize:11,color:"#d97706",fontWeight:600}}>💳 後日 PayPay還元</div>
                              <div style={{textAlign:"right"}}>
                                <span style={{fontSize:26,fontWeight:900,color:"#d97706"}}>{sbBonus.existingPayPay.toLocaleString()}</span>
                                <span style={{fontSize:11,color:"#d97706",marginLeft:2}}>PayPayPt</span>
                              </div>
                            </div>
                          )}
                          {/* au/UQ MNPポイント */}
                          {auBonus&&auBonus.totalImmediate>0&&(
                            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 14px",background:"#fff",borderRadius:10,border:"1px solid #fed7aa"}}>
                              <div style={{fontSize:11,color:"#c2410c",fontWeight:600}}>
                                {"📱 au/UQ MNP"}
                                <div style={{fontSize:9,color:"#64748b",marginTop:2}}>{"合計 "+auBonus.totalImmediate.toLocaleString()+"pt"}</div>
                              </div>
                              <div style={{textAlign:"right"}}>
                                <span style={{fontSize:26,fontWeight:900,color:"#c2410c"}}>{auBonus.totalImmediate.toLocaleString()}</span>
                                <span style={{fontSize:11,color:"#c2410c",marginLeft:2}}>pt</span>
                              </div>
                            </div>
                          )}
                          {docomoBonus&&docomoBonus.totalImmediate>0&&(
                            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 14px",background:"#fff",borderRadius:10,border:"1px solid #fee2e2"}}>
                              <div>
                                <div style={{fontSize:11,color:"#dc2626",fontWeight:600}}>{"📱 docomo MNP"}</div>
                                <div style={{fontSize:9,color:"#64748b",marginTop:2}}>{"合計 "+docomoBonus.totalImmediate.toLocaleString()+"pt"}</div>
                              </div>
                              <div style={{textAlign:"right"}}>
                                <span style={{fontSize:26,fontWeight:900,color:"#dc2626"}}>{docomoBonus.totalImmediate.toLocaleString()}</span>
                                <span style={{fontSize:11,color:"#dc2626",marginLeft:2}}>pt</span>
                              </div>
                            </div>
                          )}
                          {/* 合計 */}
                          {((effectiveStoreAmt>0||bicPtTotal>0)&&(sbBonus&&(sbBonus.totalImmediate>0||sbBonus.existingPayPay>0)||(auBonus&&auBonus.totalImmediate>0)||(docomoBonus&&docomoBonus.totalImmediate>0)))||(bicPtTotal>0&&bicPtCamps.length>1)?(
                            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:"linear-gradient(135deg,#fef3c7,#fde68a)",borderRadius:10,border:"2px solid #f59e0b",marginTop:2}}>
                              <div style={{fontSize:12,fontWeight:800,color:"#92400e"}}>合計還元</div>
                              <div style={{textAlign:"right"}}>
                                <span style={{fontSize:30,fontWeight:900,color:"#b45309"}}>¥{(effectiveStoreAmt+bicPtTotal+(sbBonus?sbBonus.totalImmediate+sbBonus.existingPayPay:0)+(auBonus?auBonus.totalImmediate:0)+(docomoBonus?docomoBonus.totalImmediate:0)).toLocaleString()}</span>
                                <span style={{fontSize:11,color:"#b45309",marginLeft:2}}>相当</span>
                              </div>
                            </div>
                          ):null}
                        </div>
                        {sbBonus&&sbBonus.type==="new"&&<div style={{fontSize:10,color:"#64748b",marginTop:6}}>{"💡 SB系MNP pt: "+sbBonus.mnpPt.toLocaleString()+" ＋ おうち割同時加入: "+sbBonus.simultaneousPt.toLocaleString()+"pt = 合計 "+sbBonus.totalImmediate.toLocaleString()+"pt"}</div>}
                        {sbBonus&&sbBonus.type==="existing"&&<div style={{fontSize:10,color:"#64748b",marginTop:6}}>{"💡 既存SBユーザー：MNP "+sbBonus.mnpPt.toLocaleString()+"pt即時 ＋ 後日"+sbBonus.existingPayPay.toLocaleString()+"PayPayPt"}</div>}
                        {sbBonus&&sbBonus.type==="mnponly"&&<div style={{fontSize:10,color:"#64748b",marginTop:6}}>{"💡 MNP "+sbBonus.mnpPt.toLocaleString()+"pt（光との同時加入ボーナスはSoftBank光/Air加入時のみ）"}</div>}
                        {auBonus&&<div style={{fontSize:10,color:"#64748b",marginTop:6}}>💡 {auBonus.note}</div>}
                      </div>
                    )}

                    {/* ④ セット割 */}
                    <div style={{borderTop:"1px solid #f1f5f9"}}>
                      <div onClick={()=>setExpandedPlan(isExpSet?null:key)} style={{padding:"8px 14px",background:"#f8fafc",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
                        <div style={{display:"flex",alignItems:"center",gap:7,minWidth:0}}>
                          <span style={{fontSize:12}}>📱</span>
                          <div style={{minWidth:0}}>
                            <span style={{fontSize:11,fontWeight:700,color:"#0369a1"}}>{setD.name}</span>
                            <span style={{fontSize:10,color:"#94a3b8",marginLeft:6}}>{setD.smartphones}</span>
                          </div>
                        </div>
                        <div style={{display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
                          <span style={{fontSize:10,fontWeight:700,color:setD.requiredOptions.length===0?"#16a34a":"#d97706",background:setD.requiredOptions.length===0?"#dcfce7":"#fef3c7",padding:"2px 7px",borderRadius:8}}>{setD.requiredOptions.length===0?"OPT不要 ✓":"必須OPTあり ⚠️"}</span>
                          <span style={{fontSize:10,color:"#94a3b8"}}>{isExpSet?"▲":"▼"}</span>
                        </div>
                      </div>
                      {isExpSet&&(
                        <div className="fade" style={{padding:"10px 14px 12px",background:"#f0f9ff"}}>
                          <div style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:"6px 12px",marginBottom:8,fontSize:11}}>
                            <span style={{color:"#64748b",fontWeight:600}}>対象スマホ</span><span style={{color:"#1e293b"}}>{setD.smartphones}</span>
                            <span style={{color:"#64748b",fontWeight:600}}>スマホ割引</span><span style={{color:"#0369a1",fontWeight:700}}>{setD.isPointReturn?"楽天P還元 ":""}-{setD.discountPerLine.toLocaleString()}円相当/月/回線（最大{setD.maxLines}回線）</span>
                            {setD.jimufeeDiscount&&<><span style={{color:"#16a34a",fontWeight:600}}>事務手数料割引</span><span style={{color:"#16a34a"}}>あんしん交換保証加入または指定窓口で -{setD.jimufeeDiscount}円（4,950円→3,850円）</span></>}
                            {setD.requiredOptions.length>0&&<><span style={{color:"#d97706",fontWeight:600}}>必須オプション</span><div>{setD.requiredOptions.map(o=>(<div key={o.name} style={{color:"#92400e",marginBottom:2}}>・{o.name}（月額約{o.fee}円）</div>))}</div></>}
                          </div>
                          <div style={{fontSize:11,color:"#475569",lineHeight:1.8,background:"#e0f2fe",borderRadius:8,padding:"7px 10px",borderLeft:"3px solid #0ea5e9",whiteSpace:"pre-line"}}>💡 {setD.note}</div>
                        </div>
                      )}
                    </div>

                    {/* ⑤ キャンペーン */}
                    {campaigns.length>0&&(
                      <div style={{borderTop:"1px solid #f1f5f9"}}>
                        <div style={{padding:"6px 14px 4px",display:"flex",alignItems:"center",gap:6}}>
                          <span style={{fontSize:9,fontWeight:700,letterSpacing:1.5,color:"#94a3b8"}}>キャンペーン</span>
                          <div style={{flex:1,height:1,background:"#f1f5f9"}}/>
                        </div>
                        {norikae.map(c=>(<CampRow key={c.id} c={c} expanded={expandedCamp===(key+"-"+c.id)} onToggle={()=>setExpandedCamp(expandedCamp===(key+"-"+c.id)?null:(key+"-"+c.id))}/>))}
                        {campaigns.filter(c=>c.type!=="norikae").map(c=>(<CampRow key={c.id} c={c} expanded={expandedCamp===(key+"-"+c.id)} onToggle={()=>setExpandedCamp(expandedCamp===(key+"-"+c.id)?null:(key+"-"+c.id))}/>))}
                      </div>
                    )}
                    {plan.note&&<div style={{padding:"6px 14px 8px",fontSize:10,color:"#94a3b8",borderTop:"1px solid #f8fafc",background:"#fafafa"}}>{plan.note}</div>}
                    </div>)}
                  </div>
                );
              })}
            </div>
            <div style={{marginTop:18,padding:"10px 13px",background:"#fffbeb",border:"1px solid #fde68a",borderRadius:10,fontSize:10,color:"#92400e",lineHeight:1.9}}>
              ⚠️ 料金・特典はビックカメラ/コジマ/ソフマップ店頭掲示（2026年4〜5月時点）の税込価格を基準としています。工事費は代表例であり設備状況により異なります。特典適用には条件があります。内容は予告なく変更・終了となる場合があります。詳しくはお近くの販売員にお問い合わせください。
            </div>
          </div>
        )}
      </div>
    </div>
  </>
  );
}

function StepCard({num,icon,label,open,done,doneText,onToggle,children}){
  return(
    <div style={{marginBottom:9,background:"#fff",border:open?"1px solid #0ea5e9":"1px solid #e2e8f0",borderRadius:14,overflow:"hidden",boxShadow:open?"0 0 0 3px rgba(14,165,233,0.08)":"0 1px 3px rgba(0,0,0,0.05)"}}>
      <div onClick={onToggle} style={{display:"flex",alignItems:"center",gap:8,padding:"11px 14px",cursor:"pointer",borderBottom:open?"1px solid #e0f2fe":"none"}}>
        <span style={{fontSize:16}}>{icon}</span>
        <div style={{flex:1}}>
          <div style={{fontSize:9,color:"#0ea5e9",letterSpacing:2,marginBottom:1}}>STEP {num}</div>
          <div style={{fontSize:13,fontWeight:700,color:"#0f172a"}}>{label}</div>
        </div>
        {done&&!open&&doneText&&<div style={{fontSize:11,color:"#16a34a",background:"#dcfce7",borderRadius:7,padding:"2px 8px",fontWeight:600}}>✓ {doneText}</div>}
        <span style={{color:"#0ea5e9",fontSize:14,transform:open?"rotate(90deg)":"none",transition:"transform .16s"}}>›</span>
      </div>
      {open&&<div style={{padding:"12px 14px"}} className="fade">{children}</div>}
    </div>
  );
}

function CampRow({c,expanded,onToggle}){
  const isN=c.type==="norikae",isNew=c.type==="newonly",isSm=c.type==="smartvalue";
  const bg=isN?"#fff5f5":isNew?"#eff6ff":c.isStore?"#fffbeb":"transparent";
  const nc=isN?"#dc2626":isNew?"#2563eb":c.isStore?"#b45309":"#1e293b";
  return(
    <div className="crow" onClick={onToggle} style={{padding:"8px 14px",borderTop:"1px solid #f1f5f9",background:bg}}>
      <div style={{display:"flex",alignItems:"center",gap:7}}>
        <span style={{fontSize:16,flexShrink:0}}>{c.badge}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
            <span style={{fontWeight:700,fontSize:12,color:nc}}>{c.name}</span>
            {isN&&<span style={{fontSize:9,fontWeight:700,background:"#fee2e2",color:"#dc2626",borderRadius:5,padding:"1px 5px"}}>乗り換え限定</span>}
            {isNew&&<span style={{fontSize:9,fontWeight:700,background:"#dbeafe",color:"#2563eb",borderRadius:5,padding:"1px 5px"}}>新規限定</span>}
            {isSm&&<span style={{fontSize:9,fontWeight:700,background:"#fef3c7",color:"#d97706",borderRadius:5,padding:"1px 5px"}}>スマートバリュー加入必須</span>}
          </div>
          {expanded&&<div className="fade" style={{fontSize:11,color:"#64748b",marginTop:3,lineHeight:1.7}}>{c.desc}</div>}
        </div>
        <div style={{textAlign:"right",flexShrink:0}}>
          {c.maxAmount>0&&<div style={{fontSize:15,fontWeight:900,color:c.color}}>¥{c.maxAmount.toLocaleString()}<span style={{fontSize:10,fontWeight:600}}>{c.isStore?"引き":"還元"}</span></div>}
          {c.unit&&<div style={{fontSize:10,color:c.color,fontWeight:600}}>{c.unit}</div>}
          <div style={{fontSize:9,color:"#94a3b8",marginTop:1}}>{expanded?"▲閉じる":"▼詳細"}</div>
        </div>
      </div>
    </div>
  );
}

function Chip({text,bg,col}){return <span style={{fontSize:9,fontWeight:700,background:bg,color:col,borderRadius:5,padding:"1px 5px",whiteSpace:"nowrap"}}>{text}</span>;}

function InfoPill({label,value,warn,green}){
  const col=green?"#16a34a":warn?"#d97706":"#64748b";
  const bg=green?"#dcfce7":warn?"#fef3c7":"#f8fafc";
  const bor=green?"#bbf7d0":warn?"#fde68a":"#e2e8f0";
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"4px 10px",background:bg,border:"1px solid "+bor,borderRadius:8,gap:1}}>
      <span style={{fontSize:9,color:"#94a3b8",fontWeight:600}}>{label}</span>
      <span style={{fontSize:12,fontWeight:700,color:col}}>{value}</span>
    </div>
  );
}

function Tog({label,value,onChange,color}){
  return(
    <div onClick={()=>onChange(!value)} style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
      <div style={{width:30,height:16,borderRadius:8,background:value?color:"#e2e8f0",position:"relative",flexShrink:0,transition:"background .15s"}}>
        <div style={{position:"absolute",top:2,left:value?14:2,width:12,height:12,borderRadius:"50%",background:"#fff",transition:"left .14s",boxShadow:"0 1px 2px rgba(0,0,0,0.15)"}}/>
      </div>
      <span style={{fontSize:11,color:value?"#1e293b":"#94a3b8"}}>{label}</span>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
